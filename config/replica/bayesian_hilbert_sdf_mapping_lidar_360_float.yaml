__base__: ../common/sdf_mapping_float.yaml
test_query:
    search_area_half_size: 2
    num_neighbor_gps: 8
    max_num_retrain_gps: 100  # max number of retrained GPs before a test query
update_hz: 10
min_num_gps_to_update: 256
gp_sdf_area_scale: 4  # should not be too small
sdf_gp:
    sign_method: "external"
    edf_gp:
        kernel_type: erl::covariance::Matern32<float, 3>
        log_lambda: 40
        max_num_samples: 128
