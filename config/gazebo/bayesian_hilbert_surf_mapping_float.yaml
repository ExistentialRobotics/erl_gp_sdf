local_bhm:
    bhm:
        diagonal_sigma: true
        min_distance: 0.0
        max_distance: 50
        sampling_area_scale: 2.5
        free_points_per_meter: 3  # should not be too small or too large
        free_sampling_margin: 0.005
        init_mu: 100.0
        init_sigma: 10000
        num_em_iterations: 1
        sparse_zero_threshold: 0.0001
        use_sparse: true
    kernel_type: erl::covariance::RadialBiasFunction<float, 2>
    kernel_setting_type: erl::covariance::Covariance<float>::Setting
    kernel:
        x_dim: 2
        scale: 0.07
        scale_mix: 1
        weights: [ ]
    min_dataset_size: 16
    min_dataset_hit_size: 8
    max_dataset_size: 64
    hit_point_buffer_size: 16
    ray_buffer_size: 256
    surface_grid_size: 7
    surface_log_odds: 0.0
    surface_log_odds_init_count: 1
    surface_log_odds_min: -20.0
    surface_log_odds_max: 20.0
    auto_surface_log_odds: true
    include_neighbor_voxels: true
    faster_prediction: true
ray_selector:
    angle_min: -2.356194496154785
    angle_max: 2.338737726211548
    num_angles: 270
    transform:
        - [ 1, 0, 0 ]
        - [ 0, 1, 0 ]
tree:
    resolution: 0.35
    tree_depth: 16
    log_odd_min: -5
    log_odd_max: 10
    log_odd_hit: 0.95
    log_odd_miss: -0.05
    log_odd_occ_threshold: 0
    use_change_detection: false
    use_aabb_limit: false
    aabb:
        center: [ 0, 0 ]
        half_sizes: [ 0, 0 ]
update_tree:
    with_count: false
    parallel: true
    lazy_eval: true
    discrete: true
update_map:
    method: 2
    surface_max_abs_logodd: 2
    surface_bad_abs_logodd: 100
    surface_step_size: 0.001
    include_neighbor_bhm: true
    max_num_bhm: 2000
    max_num_points: 50000
    max_adjust_tries: 2
    max_num_voxels: 8000
    var_scale: 0.01
    var_max: 1.5
scaling: 1.0
bhm_depth: 15
weight_sync: true
sync_method: "copy"
hinged_grid_size: 9
bhm_overlap: 0.3
bhm_overlap_sync: 1
build_bhm_on_hit: true
bhm_test_margin: 0.25
unknown_log_odds: 100.0  # unknown space log-odds
test_knn: 1
test_batch_size: 10000
