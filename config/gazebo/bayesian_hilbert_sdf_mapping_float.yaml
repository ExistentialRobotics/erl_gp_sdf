__base__: ../common/sdf_mapping_float.yaml
test_query:
    max_test_valid_distance_var: 1
    search_area_half_size: 5
    num_neighbor_gps: 4
    compute_gradient_variance: true
    compute_covariance: true
    max_num_retrain_gps: 100
min_num_gps_to_update: 256
gp_sdf_area_scale: 4
max_valid_gradient_var: 0.1
invalid_position_var: 0.5
sdf_gp:
    sign_method: "external"
    edf_gp:
        kernel_type: erl::covariance::Matern32<float, 2>
        kernel:
            x_dim: 2
        log_lambda: 20
        max_num_samples: 128
