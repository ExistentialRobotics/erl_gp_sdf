__base__: ../common/gp_occ_surf_mapping_float.yaml
sensor_gp:
    partition_on_hit_rays: false
    symmetric_partitions: true
    group_size: 26  # number of points in each group, including the overlap ones
    overlap_size: 6
    margin: 1
    sensor_range_var: 0.01
    discontinuity_var: 0.03
    max_valid_range_var: 0.04  # drop the point if its distance variance is larger than this
    sensor_frame:
        valid_range_min: 0.2
        valid_range_max: 30
        angle_min: -2.356194496154785
        angle_max: 2.338737726211548
        num_rays: 270
        discontinuity_detection: false
        discontinuity_factor: 10
        rolling_diff_discount: 0.9
        min_partition_size: 5
    gp:
        kernel_type: erl::covariance::OrnsteinUhlenbeck<float, 1>
        kernel:
            x_dim: 1
            scale: 0.5
        max_num_samples: 64
update_map_points:
    max_adjust_tries: 5
    min_observable_occ: -0.1
    min_position_var: 0.001
    min_gradient_var: 0.001
    max_surface_abs_occ: 0.02
    max_valid_gradient_var: 0.8
    max_bayes_position_var: 0.5
    max_bayes_gradient_var: 0.3
tree:
    resolution: 0.1
    log_odd_min: -2
    log_odd_max: 10
    log_odd_hit: 0.85
    log_odd_miss: -0.2
    log_odd_occ_threshold: 0
cluster_depth: 14
surface_resolution: 0.0
scaling: 1.0
perturb_delta: 0.001  # this makes the SDF prediction smoother over time
zero_gradient_threshold: 1.0e-10
