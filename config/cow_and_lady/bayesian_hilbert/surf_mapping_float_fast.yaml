__base__: ../common/bayesian_hilbert_surf_mapping_float.yaml
local_bhm:
    bhm:
        diagonal_sigma: true
        min_distance: 0.1
        max_distance: 3.5
        sampling_area_scale: 3.5
        free_points_per_meter: 3.0
        free_sampling_margin: 0.001
    kernel_type: erl::covariance::RadialBiasFunction<float, 3>
    kernel:
        x_dim: 3
        scale: 0.022
    min_dataset_size: 64
    min_dataset_hit_size: 48
    max_dataset_size: 150
    hit_point_buffer_size: 64
    ray_buffer_size: 1024
    surface_grid_size: 5
ray_selector:
    azimuth_min: -0.55
    azimuth_max: 0.55
    elevation_min: -0.43
    elevation_max: 0.43
    num_azimuth_angles: 640
    num_elevation_angles: 480
    transform: # transform from optical frame to camera frame
        - [ 0, 0, 1, 0 ]
        - [ -1, 0, 0, 0 ]
        - [ 0, -1, 0, 0 ]
tree:
    resolution: 0.07
    log_odd_min: -10
    log_odd_max: 20
    log_odd_hit: 0.7
    log_odd_miss: -0.1
    log_odd_occ_threshold: 1
update_map:
    method: 2
    max_num_bhm: 1000
    max_num_voxels: 8000
scaling: 1.0
hinged_grid_size: 5
bhm_test_margin: 0.04
unknown_log_odds: -100.0 # unknown space log-odds
