__base__: ../../common/bayesian_hilbert_surf_mapping_float.yaml
local_bhm:
    bhm:
        min_distance: 0.2
        max_distance: 4.0
        sampling_area_scale: 2.5
        free_points_per_meter: 12.0 # 7.5
        init_mu: 5.0
        free_sampling_margin: 0.001
    kernel_type: erl::covariance::RadialBiasFunction<float, 3>
    kernel:
        x_dim: 3
        scale: 0.013 # 0.011
    min_dataset_size: 20
    min_dataset_hit_size: 10
    max_dataset_size: 200
    hit_point_buffer_size: 256
    ray_buffer_size: 2048
    surface_grid_size: 8
ray_selector:
    azimuth_min: -0.55
    azimuth_max: 0.55
    elevation_min: -0.43
    elevation_max: 0.43
    num_azimuth_angles: 640
    num_elevation_angles: 480
    transform: # transform from optical frame to camera frame
        - [0, 0, 1, 0]
        - [-1, 0, 0, 0]
        - [0, -1, 0, 0]
tree:
    tree_depth: 8
    resolution: 0.05
    log_odd_min: -10
    log_odd_max: 50
    log_odd_hit: 0.9
    log_odd_miss: -0.1
    log_odd_occ_threshold: 10
update_map:
    method: 2
    max_update_dist: 3.5
    max_num_bhm: 1500
    max_num_voxels: 20000
    # Variance calibration (vs the common defaults var_scale=500, var_max=1.5).
    # The method-2 surface-point variance is var_position = var_max * x_pos /
    # (x_pos + var_max) with x_pos = var_scale * diff^2 / norm_sq
    # (bayesian_hilbert_surface_mapping.cpp ~L2806). Because diff is tiny
    # (~surface residual) and norm_sq is large (sharp RBF field, scale 0.013),
    # var_scale must be ~1e6 for a sane SDF variance — the common default 500 is
    # ~2000x too small under this equation, giving E[z^2]~1e5 (wildly overconfident).
    # Tuned against the cow_and_lady GT SDF:
    #   var_scale=6e6  -> cow_only E[z^2]=1.03, Cov@95%=95.0%, ECE=0.031 (calibrated)
    #   var_max=0.3    -> caps sigma_position at ~sqrt(0.3)=0.55, below the ~0.6 max
    #                     |SDF error|, so reported sigma stays physical (no 20 m tails).
    # The scene grid then sits at E[z^2]~2.8 (irreducible far-field heavy tail) but is
    # bulk-calibrated (ECE 0.058, Cov 84%); SDF/mesh accuracy is unchanged.
    var_scale: 6000000
    var_max: 0.3
bhm_depth: 7
scaling: 1.0
hinged_grid_size: 7
bhm_test_margin: 0.03
