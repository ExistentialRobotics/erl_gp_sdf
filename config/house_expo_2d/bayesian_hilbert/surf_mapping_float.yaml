__base__: ../../common/bayesian_hilbert_surf_mapping_float.yaml
local_bhm:
    bhm:
        min_distance: 0.01
        max_distance: 10
        sampling_area_scale: 4.0
        free_points_per_meter: 2.0
        free_sampling_margin: 0.01
        init_mu: 10.0
    kernel_type: erl::covariance::RadialBiasFunction<float, 2>
    kernel:
        x_dim: 2
        scale: 0.03
    min_dataset_size: 10
    min_dataset_hit_size: 5
    max_dataset_size: 256
    hit_point_buffer_size: 256
    ray_buffer_size: 2048
    surface_grid_size: 7
    surface_log_odds: .inf   # sentinel: auto-seed the surface level from the first estimate
ray_selector:    # matches the House Expo 2D LiDAR specs (360 rays over the full circle)
    angle_min: -3.141592653
    angle_max: 3.141592653
    num_angles: 360
    transform:
        - [ 1, 0, 0 ]
        - [ 0, 1, 0 ]
tree:
    resolution: 0.2
    log_odd_min: -5
    log_odd_max: 10
    log_odd_hit: 0.95
    log_odd_miss: -0.05
    log_odd_occ_threshold: 0
update_map:
    method: 2
    max_num_bhm: 2000
    max_num_voxels: 8000
    var_scale: 1000
scaling: 1.0
hinged_grid_size: 9
bhm_overlap_sync: 1
bhm_test_margin: 0.04
unknown_log_odds: 100.0  # unknown space log-odds, >0: occupied, <0: free